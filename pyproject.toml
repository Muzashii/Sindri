[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sindri"
version = "1.1.0"
description = "Encaixe automático (nesting) de peças DXF para corte a laser no RDWorks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.1",
    "pypdf>=4.0",
    "shapely>=2.0.4",
    "pyclipper>=1.3",
    "numpy>=1.26,<3",
    "PySide6>=6.6,<6.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "pyinstaller>=6", "ruff>=0.5"]

[project.scripts]
sindri-cli = "app.cli:main"

[project.gui-scripts]
sindri = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app/core"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# só erros de verdade: nomes indefinidos, imports sem uso, armadilhas comuns (B)
select = ["F", "B"]
ignore = ["B007", "B905", "B008", "B904", "B028", "B006", "B018", "B015", "B019", "B020", "B026", "B009", "B010"]
