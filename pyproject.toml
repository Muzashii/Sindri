[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sindri"
version = "1.0.0"
description = "Encaixe automático (nesting) de peças DXF para corte a laser no RDWorks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.1",
    "pypdf>=4.0",
    "shapely>=2.0.4",
    "pyclipper>=1.3",
    "numpy>=1.26,<3",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "pyinstaller>=6"]

[project.scripts]
sindri-cli = "app.cli:main"

[project.gui-scripts]
sindri = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app/core"]
