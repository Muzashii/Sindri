name: Compilar Sindri.exe
on:
  push:
    tags: ["exe-*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Bibliotecas (versões fixas do requirements-build.txt)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt pytest
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider
      - name: Compilar
        run: python -m app.build_windows --distpath dist
      - name: Testar a inicialização do .exe
        shell: pwsh
        run: ./tools/check_exe.ps1 -Executable dist/Sindri.exe -RedirectOutput
      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash dist/Sindri.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/Sindri.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Sindri-exe
          path: |
            dist/Sindri.exe
            dist/Sindri.exe.sha256
      - name: Publicar na página de versões (Releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sindri.exe
            dist/Sindri.exe.sha256
          name: Sindri ${{ github.ref_name }}
          body: "Executável único para Windows (compilado automaticamente). Baixe o Sindri.exe e abra."
